server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Quan trọng với React Router (SPA): mọi route không khớp file tĩnh
    # đều fallback về index.html, để React tự xử lý routing phía client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Video có thể khá nặng — bật hỗ trợ tua (range request), nếu không
    # trình duyệt sẽ luôn phải tải lại từ đầu mỗi lần tua video.
    location /videos/ {
        add_header Accept-Ranges bytes;
    }
}